<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le voyage du Professeur Pile Poil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Mise en page : écran d'arcade sombre et étoilé ; un plateau de jeu à gauche, le Professeur et les commandes à droite ; tout s'empile sur téléphone. */
:root{
  --space:#140c3c; --panel:#2a1a78; --panel-hi:#4630b4; --panel-lo:#211563; --ink:#120a2e;
  --text:#ffffff; --muted:#cfc6ff; --yellow:#ffd23f; --yellow-lo:#e09a1a; --orange:#ff8a2a;
  --pink:#ff6fb0; --cyan:#7ff7ff; --green:#5fd35a; --green-lo:#2e9a36; --red:#ff5a4a; --cream:#fff1b0;
  --floor:#3b2a8f; --floor2:#35258a; --wall:#ff8a2a;
  --f-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-read:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--space);color:var(--text);font-family:var(--f-read);font-size:20px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--space) var(--bgimg) center bottom/cover no-repeat;image-rendering:pixelated;opacity:.35}
img{image-rendering:pixelated}
#app{max-width:1200px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-pixel);font-size:14px;color:var(--yellow);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
.brand small{display:block;font-size:9px;color:var(--cyan);margin-top:6px;letter-spacing:.5px}
.steps{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.step{font-family:var(--f-pixel);font-size:9px;padding:8px 10px;background:var(--panel-lo);border:3px solid var(--ink);color:var(--muted);display:flex;align-items:center;gap:6px}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--ink);color:var(--muted)}
.step.on{background:var(--yellow);color:var(--ink)}
.step.on b{background:var(--ink);color:var(--yellow)}
.step.done{color:var(--green)}
@media (max-width:640px){.step .lb{display:none}.steps{order:3;flex-basis:100%}}
.step.done b{background:var(--green);color:var(--ink)}
.tools{display:flex;gap:8px}
.icon-btn{width:48px;height:48px;display:grid;place-items:center;background:var(--panel);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--panel-hi),3px 3px 0 var(--ink);color:var(--text);cursor:pointer;padding:0}
.icon-btn svg{width:26px;height:26px}
.icon-btn[aria-pressed="false"]{opacity:.55}
.panel{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--panel-hi),6px 6px 0 var(--ink);padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2{font-family:var(--f-pixel);font-weight:400;line-height:1.5;text-wrap:balance;margin:0}
h1{font-size:clamp(18px,3.2vw,30px);color:var(--yellow);text-shadow:4px 4px 0 var(--ink)}
h2{font-size:clamp(13px,1.8vw,16px);color:var(--cyan);text-shadow:3px 3px 0 var(--ink)}
.tag{display:inline-block;font-family:var(--f-pixel);font-size:9px;padding:6px 8px;background:var(--pink);color:var(--ink);border:3px solid var(--ink)}
.tag.cy{background:var(--cyan)}
/* Boutons */
.btn{font-family:var(--f-pixel);font-size:13px;line-height:1.4;padding:16px 18px;min-height:56px;border:4px solid var(--ink);background:var(--yellow);color:var(--ink);
  box-shadow:inset -4px -4px 0 var(--yellow-lo),inset 4px 4px 0 #fff4b8,4px 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:inset -4px -4px 0 var(--yellow-lo),inset 4px 4px 0 #fff4b8,1px 1px 0 var(--ink)}
.btn.go{background:var(--green);box-shadow:inset -4px -4px 0 var(--green-lo),inset 4px 4px 0 #b6f5a8,4px 4px 0 var(--ink)}
.btn.ghost{background:var(--panel-lo);color:var(--text);box-shadow:inset 0 0 0 2px var(--panel-hi),4px 4px 0 var(--ink)}
.btn:disabled{filter:grayscale(.8);opacity:.5;cursor:not-allowed}
.btn:focus-visible,.icon-btn:focus-visible,.arrow:focus-visible,.choice:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
/* Dialogue du Professeur */
.dialog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:end}
.dialog .portrait{width:clamp(84px,11vw,128px);height:auto;align-self:end;filter:drop-shadow(4px 4px 0 var(--ink))}
.bubble{background:var(--cream);color:var(--ink);border:4px solid var(--ink);padding:16px 18px;position:relative;box-shadow:5px 5px 0 var(--ink);min-width:0}
.bubble::before{content:"";position:absolute;left:-16px;bottom:22px;border:8px solid transparent;border-right-color:var(--ink);border-bottom-color:var(--ink)}
.bubble .who{font-family:var(--f-pixel);font-size:9px;color:#8a3ccc;margin-bottom:8px}
.bubble p{margin:0 0 12px;font-size:clamp(19px,2.2vw,24px);font-weight:600;line-height:1.35;min-height:2.7em}
.bubble .row{justify-content:space-between}
.speak{width:52px;height:52px;border:3px solid var(--ink);background:var(--cyan);display:grid;place-items:center;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.speak svg{width:26px;height:26px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;background:#d8cfa0;display:block}
.dots i.on{background:var(--ink)}
/* Plateau */
.board-wrap{position:relative;width:100%;max-width:100%}
.board{position:relative;display:grid;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--ink);gap:2px;width:100%}
.cell{aspect-ratio:1;background:var(--floor);position:relative;display:grid;place-items:center;min-width:0}
.cell:nth-child(odd){background:var(--floor2)}
.cell.space{background:#1a1050}
.cell.space:nth-child(odd){background:#1d1256}
.cell.wall{background:var(--wall);box-shadow:inset -5px -5px 0 #c4501c,inset 5px 5px 0 #ffc070}
.cell.exit{background:var(--yellow);box-shadow:inset 0 0 0 5px #fff4b8}
.cell.start{background:#4fa8ff;box-shadow:inset 0 0 0 5px #9ad4ff}
.cell img{width:92%;height:auto}
.cell .lbl{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-family:var(--f-pixel);font-size:clamp(6px,.8vw,9px);color:var(--cream);text-shadow:2px 2px 0 var(--ink);pointer-events:none}
.cell.hint{outline:4px solid var(--cyan);outline-offset:-4px;z-index:1}
.sprite{position:absolute;display:grid;place-items:center;transition:left .38s steps(4),top .38s steps(4),transform .2s;pointer-events:none;z-index:2}
.sprite img{width:78%;height:auto;filter:drop-shadow(3px 3px 0 var(--ink));transition:transform .2s}
.sprite.bump{animation:bump .4s}
@keyframes bump{25%{transform:translateX(-8%)}50%{transform:translateX(8%)}75%{transform:translateX(-4%)}}
.sprite.land img{animation:land 1.2s forwards}
@keyframes land{to{transform:scale(.25) rotate(360deg);opacity:0}}
/* Programme */
.prog-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prog-head span{font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--ink);min-height:74px}
.card{width:54px;height:54px;display:grid;place-items:center;background:var(--cream);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #e0c870;position:relative;cursor:pointer;padding:0}
.card svg{width:34px;height:34px}
.card.empty{background:transparent;border:3px dashed #5a4aa8;box-shadow:none;cursor:default}
.card.start{background:var(--green);font-family:var(--f-pixel);font-size:9px;color:var(--ink);cursor:default}
.card.cur{background:var(--yellow);transform:translateY(-6px);box-shadow:0 6px 0 var(--cyan)}
.card.err{background:var(--red)}
.card.ok{background:#b6f5a8}
.card.missing{border-color:var(--pink);color:var(--pink);font-family:var(--f-pixel);font-size:18px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.card .n{position:absolute;top:-2px;left:2px;font-family:var(--f-pixel);font-size:7px;color:#8a7a40}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px);gap:8px;justify-content:center}
.arrow{width:72px;height:72px;border:4px solid var(--ink);background:var(--cyan);box-shadow:inset -4px -4px 0 #34b8c8,inset 4px 4px 0 #d8ffff,4px 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.arrow:active{transform:translate(3px,3px)}
.arrow svg{width:40px;height:40px}
.arrow.u{grid-column:2;grid-row:1}.arrow.l{grid-column:1;grid-row:2}.arrow.d{grid-column:2;grid-row:2}.arrow.r{grid-column:3;grid-row:2}
.msg{font-weight:600;font-size:20px;padding:12px 14px;border:4px solid var(--ink);background:var(--panel-lo);min-height:56px}
.msg.bad{background:#5a1838;color:#ffd0dc}
.msg.good{background:#1d5a2a;color:#d8ffd0}
/* Choix QCM */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.choice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px;background:var(--panel-lo);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--panel-hi),5px 5px 0 var(--ink);color:var(--text);cursor:pointer;font-family:var(--f-read);font-size:20px;font-weight:600;text-align:center;position:relative}
.choice .pic{height:84px;display:flex;align-items:center;justify-content:center;gap:6px}
.choice .pic img{height:100%;width:auto}
.choice .letter{position:absolute;top:8px;left:8px;font-family:var(--f-pixel);font-size:11px;color:var(--yellow)}
.choice .mini-speak{position:absolute;top:6px;right:6px;width:36px;height:36px;background:var(--cyan);border:3px solid var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.choice .mini-speak svg{width:20px;height:20px}
.choice.right{background:#1d5a2a;box-shadow:inset 0 0 0 3px var(--green),5px 5px 0 var(--ink)}
.choice.wrong{background:#5a1838;box-shadow:inset 0 0 0 3px var(--red),5px 5px 0 var(--ink);opacity:.75}
/* Fusée à réparer */
.rocket-svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.voyage{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:14px 10px 30px;background:var(--ink);position:relative;overflow:hidden}
.voyage .pl{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;min-width:0}
.voyage .pl img{width:clamp(36px,6vw,64px);height:auto}
.voyage .pl span{font-family:var(--f-pixel);font-size:clamp(6px,.9vw,9px);color:var(--muted);white-space:nowrap}
.voyage .pl.here span{color:var(--yellow)}
.voyage .line{position:absolute;left:8%;right:8%;top:42%;border-top:4px dashed #5a4aa8}
.voyage .ship{position:absolute;bottom:2px;width:clamp(22px,3vw,30px);transition:left 2.2s steps(22);z-index:2}
.defis{display:grid;gap:12px}
.defi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;background:var(--panel-lo);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--panel-hi)}
.defi .num{font-family:var(--f-pixel);font-size:18px;color:var(--yellow);width:44px;height:44px;display:grid;place-items:center;background:var(--ink)}
.defi h3{margin:0 0 4px;font-size:20px}
.defi p{margin:0;color:var(--muted);font-size:16px}
.defi.lock{opacity:.5}
.defi.done .num{background:var(--green);color:var(--ink)}
/* Consignes débranchées */
.howto{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.howto li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--panel-lo);border:3px solid var(--ink);padding:10px 12px;font-size:20px;font-weight:600}
.howto li::before{content:counter(s);font-family:var(--f-pixel);font-size:14px;width:44px;height:44px;display:grid;place-items:center;background:var(--yellow);color:var(--ink);border:3px solid var(--ink)}
.howto li .mini-speak{width:40px;height:40px;background:var(--cyan);border:3px solid var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.howto li .mini-speak svg{width:20px;height:20px}
.howto .ar{display:inline-flex;vertical-align:middle;width:26px;height:26px;background:var(--cyan);border:2px solid var(--ink);margin:0 2px}
.howto .ar svg{width:100%;height:100%}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;background:var(--ink);border:4px solid var(--ink)}
.timer .t{font-family:var(--f-pixel);font-size:clamp(28px,5vw,44px);color:var(--yellow);font-variant-numeric:tabular-nums;text-shadow:4px 4px 0 #3a2a8a}
.timer .t.over{color:var(--pink);animation:blink 1s steps(2) infinite}
/* Défis 2 et 3 */
.cans{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:10px;background:var(--ink)}
.cans .grp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.can{width:clamp(40px,5vw,56px);position:relative;display:block}
.can svg{width:100%;height:auto;display:block}
.can.lit{outline:4px solid var(--yellow);outline-offset:2px}
.can.lit::after{content:attr(data-c);position:absolute;top:-14px;right:-8px;background:var(--yellow);color:var(--ink);font-family:var(--f-pixel);font-size:11px;padding:3px 5px;border:2px solid var(--ink)}
.op{font-family:var(--f-pixel);font-size:clamp(18px,3vw,30px);color:var(--yellow)}
.eq{font-family:var(--f-pixel);font-size:clamp(18px,3vw,28px);text-align:center;color:var(--cream)}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.num-btn{font-family:var(--f-pixel);font-size:clamp(16px,2.4vw,24px);aspect-ratio:1.4;border:4px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:inset -4px -4px 0 #e0c870,4px 4px 0 var(--ink);cursor:pointer}
.num-btn:active{transform:translate(3px,3px)}
.num-btn.right{background:var(--green)}
.num-btn.wrong{background:var(--red);opacity:.6}
.gauge{display:grid;grid-template-rows:repeat(10,1fr);gap:4px;width:90px;height:260px;padding:6px;background:var(--ink);border:4px solid var(--ink)}
.gauge i{display:block;background:#2a2060}
.gauge i.on{background:var(--yellow);box-shadow:inset -4px 0 0 var(--yellow-lo)}
.cell.build{background:#2e2380}
.cell.build:nth-child(odd){background:#33288a}
.placed{width:86%;display:block;animation:popk .25s steps(3)}
.placed svg{width:100%;height:auto;display:block}
.cursor{position:absolute;border:5px solid var(--yellow);box-shadow:0 0 0 3px var(--ink);transition:left .25s steps(3),top .25s steps(3);pointer-events:none;z-index:3;animation:blink 1.2s steps(2) infinite}
.brickbtn{background:var(--cream);box-shadow:inset -4px -4px 0 #e0c870,4px 4px 0 var(--ink)}
.brickbtn svg{width:46px;height:46px}
/* Radar */
.radar{position:absolute;width:0;height:0;z-index:4;pointer-events:none}
.radar::before{content:"";position:absolute;width:260%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%)}
.radar .beam{position:absolute;left:0;top:0;width:min(60vw,640px);height:min(60vw,640px);transform:translate(-50%,-50%);border-radius:50%;
  background:conic-gradient(from 0deg,rgba(95,211,90,.55),rgba(95,211,90,0) 25%);animation:sweep 1.2s linear infinite;border:3px solid rgba(95,211,90,.6)}
@keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cell.blip{outline:5px solid var(--green);outline-offset:-5px;animation:blink .5s steps(2) 6}
/* Défi 3 : modèle + aide */
.twin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.tw-label{color:var(--cyan);font-size:10px}
.cell.startcell{box-shadow:inset 0 0 0 4px var(--pink)}
.helpbtn{background:var(--cream)}
.bulb{display:inline-block;width:26px;height:26px;vertical-align:middle;margin-right:6px}
.bulb svg{width:100%;height:100%}
.helpbox{background:var(--cream);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;animation:popk .3s steps(3)}
.helpbox::before{content:"";position:absolute;right:28%;top:-20px;border:10px solid transparent;border-bottom-color:var(--ink)}
.helptitle{font-family:var(--f-pixel);font-size:11px;line-height:1.6;color:#8a3ccc;display:flex;align-items:center}
.helpbox p{margin:0;font-size:19px;font-weight:600}
.helpbox .closehelp{min-height:40px;padding:6px 10px;font-size:10px}
.helpdemo{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.minib{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;width:110px;aspect-ratio:1;background:var(--ink);border:3px solid var(--ink);flex:none}
.minib i{background:#33288a;display:grid;place-items:center}
.minib .mcur{position:absolute;width:50%;height:50%;border:4px solid var(--yellow);box-sizing:border-box;transition:left .3s steps(3),top .3s steps(3)}
.miniseq{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.miniseq .card{width:40px;height:40px}
.miniseq .card svg{width:26px;height:26px}
.profpos{transition:transform 1.2s steps(8)}
.rocket-svg{max-width:300px}
.score{display:flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:12px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 12px;height:48px}
.score b{font-size:16px;font-weight:400;font-variant-numeric:tabular-nums}
.score .sstar{color:#ff8a2a}
.score.bump{animation:scorebump .6s steps(3)}
@keyframes scorebump{40%{transform:scale(1.25)}}
.ptsfly{position:fixed;right:max(24px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));z-index:70;font-family:var(--f-pixel);font-size:20px;color:var(--yellow);text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:flyup 1.6s steps(12) forwards}
@keyframes flyup{to{transform:translateY(-40px);opacity:0}}
.bigscore{display:flex;align-items:baseline;gap:10px;font-family:var(--f-pixel);color:var(--ink)}
.bigscore b{font-size:clamp(44px,8vw,80px);font-weight:400;background:none;padding:0}
.bigscore small{font-size:clamp(14px,2vw,20px);color:#8a3ccc}
.bigscore .sstar{font-size:clamp(28px,5vw,48px);color:#ff8a2a}
.modelbox{display:flex;flex-direction:column;gap:6px;max-width:300px}
.lboard{position:relative;width:100%;max-width:560px;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background-color:#2e7a3a;background-image:radial-gradient(circle,#3f9a4c 22%,transparent 24%);background-size:calc(100% / 11) calc(100% / 7)}
.lboard.small{box-shadow:3px 3px 0 var(--ink)}
.lslot{position:absolute;box-sizing:border-box}
.lslot svg{position:absolute;left:0;bottom:0;width:100%;height:120%}
.lslot.todo{border:3px dashed var(--yellow);background:rgba(255,210,63,.22);cursor:pointer;animation:slotpulse 1.4s steps(2) infinite}
@keyframes slotpulse{50%{background:rgba(255,210,63,.45)}}
.lslot.later{border:2px dotted rgba(255,255,255,.35)}
.lslot.dropping.todo{background:rgba(255,210,63,.35)}
.lslot.pop svg{animation:popk .25s steps(3)}
.lsteps{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.lsteps li{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel-lo);border:3px solid var(--ink);font-weight:600;font-size:17px;color:var(--muted)}
.lsteps li b{font-family:var(--f-pixel);font-size:11px;width:26px;height:26px;display:grid;place-items:center;background:var(--ink);color:var(--muted)}

/* ---------- Voix off : audio/<id>.mp3 (ElevenLabs), sinon voix du navigateur ---------- */
const AUDIO_DIR = 'audio/';
let vAudio = null, vEnd = null, vSrc = null;
const vMissing = new Set(), AUDIO_BUST = {}, AUDIO_VER = {};
function stopVoice(){
  const f = vEnd; vEnd = null;
  if (f) f(false);
  if (vSrc){ vSrc.onended = null; try { vSrc.stop(); } catch(e) {} vSrc = null; }
  if (vAudio){ vAudio.onended = vAudio.onerror = vAudio.onplaying = null; try { vAudio.pause(); } catch(e) {} vAudio = null; }
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e) {}
}
const audioUrl = id => AUDIO_DIR + id + '.mp3' + ((AUDIO_BUST[id] || AUDIO_VER[id]) ? '?v=' + (AUDIO_BUST[id] || AUDIO_VER[id]) : '');
const AUDIO_CACHE = {};
function getAudio(id){            // un seul objet Audio par fichier, chargé à l'avance
  const url = audioUrl(id); let a = AUDIO_CACHE[url];
  if (!a){ try { a = new Audio(); a.preload = 'auto'; a.addEventListener('error', () => vMissing.add(id)); a.src = url; AUDIO_CACHE[url] = a; } catch(e) { vMissing.add(id); return null; } }
  return a;
}
function preloadVoices(ids){ (ids || []).flat().forEach(id => { if (!id || vMissing.has(id)) return; if (USE_WA) loadBuf(id).catch(() => vMissing.add(id)); else getAudio(id); }); }
const USE_WA = /^https?:/.test(location.protocol) && !!(window.AudioContext || window.webkitAudioContext);
const WA = {buf:{}, loading:{}};
const audioCtx = () => { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); return actx; };
function trimBounds(buf){        // coupe le silence au début et à la fin du fichier (ElevenLabs en laisse un peu)
  const d = buf.getChannelData(0), sr = buf.sampleRate, thr = 0.015; let a = 0, b = d.length - 1;
  while (a < d.length && Math.abs(d[a]) < thr) a++;
  while (b > a && Math.abs(d[b]) < thr) b--;
  return [Math.max(0, a / sr - 0.03), Math.min(buf.duration, b / sr + 0.12)];
}
function loadBuf(id){
  const url = audioUrl(id);
  if (WA.buf[url]) return Promise.resolve(WA.buf[url]);
  return WA.loading[url] || (WA.loading[url] = (async () => {
    const r = await fetch(url); if (!r.ok) throw new Error('absent');
    const buf = await audioCtx().decodeAudioData(await r.arrayBuffer());
    const [s0, e0] = trimBounds(buf); return (WA.buf[url] = {buf, s:s0, e:Math.max(e0, s0 + 0.2)});
  })());
}
const pauseVoice = () => { try { if (vSrc) audioCtx().suspend(); else vAudio && vAudio.pause(); 'speechSynthesis' in window && speechSynthesis.pause(); } catch(e) {} };
const resumeVoice = () => { try { if (vSrc) audioCtx().resume(); else vAudio && vAudio.play().catch(() => {}); 'speechSynthesis' in window && speechSynthesis.resume(); } catch(e) {} };
function voice(id, onStart){
  stopVoice();
  return new Promise(res => {
    let fin = false, st = onStart;
    const started = () => { const f = st; st = null; if (f) f(); };
    const finish = ok => { if (fin) return; fin = true; started(); if (vEnd === finish) vEnd = null; res(ok); };
    vEnd = finish;
    const text = plain(T(id)).replace(/\n/g, ' ');
    const timed = () => { started(); setTimeout(() => finish(true), Math.max(1500, text.length * 70)); };
    const tts = () => {
      try {
        if (!('speechSynthesis' in window)) return timed();
        const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = .9; u.pitch = 1.1;
        u.onstart = started; u.onend = () => finish(true); u.onerror = () => finish(true); speechSynthesis.speak(u);
      } catch(e) { timed(); }
    };
    if (vMissing.has(id)) return tts();
    if (USE_WA){
      loadBuf(id).then(b => {
        if (fin) return;
        const ctx = audioCtx(); try { ctx.resume(); } catch(e) {}
        const src = ctx.createBufferSource(); src.buffer = b.buf; src.connect(ctx.destination);
        vSrc = src; src.onended = () => { if (vSrc === src) vSrc = null; finish(true); };
        src.start(0, b.s, b.e - b.s); started();
      }).catch(() => { vMissing.add(id); if (!fin) tts(); });
      return;
    }
    const a = getAudio(id); if (!a) return tts();
    vAudio = a;
    try { a.currentTime = 0; } catch(e) {}
    a.onplaying = started;
    a.onended = () => finish(true);
    a.onerror = () => { vMissing.add(id); if (!fin) tts(); };
    try {
      const pr = a.play();
      if (pr && pr.catch) pr.catch(err => { if (fin) return; if (err && err.name === 'NotAllowedError') timed(); else { vMissing.add(id); tts(); } });
    } catch(e) { vMissing.add(id); tts(); }
  });
}

  preloadVoices(lines);
  async function play(item){
    const k = ++pl; cur = item; el.classList.add('talking'); next.classList.remove('ready');
    const ids = Array.isArray(item) ? item : [item];   // plusieurs phrases ensemble : une par ligne (sauf « Tu as utilisé N boutons »)
    dtext.innerHTML = rich(ids.map(W).join(ids.some(k => k.startsWith('num_')) ? ' ' : '\n'));
    let ok = true;
    for (const id of (Array.isArray(item) ? item : [item])){ ok = await voice(id); if (!ok) break; }
    if (k !== pl || my !== epoch) return false;
    el.classList.remove('talking');
    if (ok){ next.classList.add('ready'); if (el.afterLine) el.afterLine(item);
      /* Enchaînement automatique (enfants de 6 ans) : phrase suivante, puis étape suivante, sans cliquer */
      if (item === lines[i]){
        if (i < lines.length - 1) setTimeout(() => { if (k === pl && my === epoch && lines[i] === item){ i++; show(); } }, opts.gap ?? 700);
        else if (onDone && !opts.stay) setTimeout(() => { if (k === pl && my === epoch && onDone){ stopVoice(); onDone(); } }, opts.auto ?? 1200);
      }
    }
    return ok;
  }
  function show(){
    const last = i === lines.length - 1;
    [...dots.children].forEach((d,k) => d.classList.toggle('on', k === i));
    dots.style.visibility = lines.length > 1 ? 'visible' : 'hidden';
    next.hidden = !(last && opts.stay);   // plus de « Suivant » : seul un bouton d'action du jeu reste (ex. Allumer le radar)
    next.textContent = ((last && opts.last) ? opts.last : UP('ui_next')) + ' ▶';
    if (lines.length) play(lines[i]);
  }
  next.onclick = () => {
    if (my !== epoch) return;
    if (i < lines.length - 1){ i++; show(); } else { stopVoice(); onDone && onDone(); }
  };
  el.setLines = (ls, done, o={}) => { lines = expand(ls); preloadVoices(lines); onDone = done; opts = o; i = 0; dots.innerHTML = lines.map(() => '<i></i>').join(''); show(); };
  el.say = id => { next.hidden = true; dots.style.visibility = 'hidden'; return play(id); };
  dots.innerHTML = lines.map(() => '<i></i>').join('');
  setTimeout(show, 0);
  return el;
}

/* Choix en images : le Professeur lit chaque réponse, chacune a aussi son bouton « écouter » */
function optionsBox(dlg, {options, correct, hints, onRight}){
  const box = h(`<div class="choices"></div>`);
  preloadVoices([...options.map(o => o.id), ...hints.filter(Boolean)]);
  let first = true, read = false, stopped = false;
  const els = options.map((o,i) => {
    const e = h(`<div class="opt"><button class="pick" aria-label="Choisir cette réponse"><span class="letter">${'ABC'[i]}</span><span class="picimg">${o.pic}</span><span class="otext">${rich(o.text||'')}</span></button></div>`);
    $('.pick', e).onclick = () => {
      stopped = true;
      if (i === correct){
        e.classList.add('right'); box.querySelectorAll('button').forEach(b => b.disabled = true); jingle(); confetti(); onRight(first);
      } else {
        first = false; e.classList.add('wrong'); $('.pick', e).disabled = true; buzz();
        dlg.setLines([hints[i] || hints.find(Boolean)], null, {hideLast:true});
      }
    };
    box.appendChild(e); return e;
  });
  dlg.afterLine = async () => {
    if (read) return; read = true;
    for (let k = 0; k < els.length; k++){
      if (stopped) return;
      const ok = await voice(options[k].id, () => els[k].classList.add('glow')); els[k].classList.remove('glow');
      if (!ok) return; await sleep(100);
    }
  };
  return box;
}

/* ---------- Plateau générique ---------- */
function board(w, hgt, cellFn){
  const wrap = h(`<div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${w},minmax(0,1fr))"></div></div>`);
  const b = $('.board', wrap); const cells = [];
  for (let y=0;y<hgt;y++) for (let x=0;x<w;x++){ const c = document.createElement('div'); c.className = 'cell'; cellFn && cellFn(c,x,y); b.appendChild(c); cells.push(c); }
  wrap.cell = (x,y) => cells[y*w+x];
  wrap.sprite = (src, x, y, alt) => {
    const s = h(`<div class="sprite"><img src="${src}" alt="${alt||''}"></div>`);
    s.style.width = `calc((100% - ${(w-1)*2}px)/${w})`; s.style.height = `calc((100% - ${(hgt-1)*2}px)/${hgt})`;
    s.place = (px,py,dir) => { s.style.left = `calc(${px} * ((100% - ${(w-1)*2}px)/${w} + 2px))`; s.style.top = `calc(${py} * ((100% - ${(hgt-1)*2}px)/${hgt} + 2px))`; if (dir) $('img', s).style.transform = `rotate(${ROT[dir]}deg)`; s.x = px; s.y = py; };
    s.place(x,y); b.appendChild(s); return s;
  };
  return wrap;
}

/* Exécute un programme pas à pas. Renvoie {ok, x, y, fail, why}. */
async function execute(prog, start, isFree, step, ms=430){
  let x = start[0], y = start[1]; const my = epoch;
  for (let i=0;i<prog.length;i++){
    if (my !== epoch) return {ok:false, abort:true};
    const [dx,dy] = DIRS[prog[i]]; const nx = x+dx, ny = y+dy; const f = isFree(nx,ny);
    if (f !== true){ await step(i, x, y, prog[i], f); return {ok:false, x, y, fail:i, why:f}; }
    x = nx; y = ny; await step(i, x, y, prog[i], true); await sleep(ms);
  }
  return {ok:true, x, y};
}

  S.pts = S.pts || {};

  S.pts[key] = n; save(); renderScore();
  if (!n) return;
  const box = $('#scoreBox'); box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
  const f = h(`<div class="ptsfly">+${n} points</div>`); document.body.appendChild(f); setTimeout(() => f.remove(), 1600);
  [880,1175].forEach((fq,i) => setTimeout(() => beep(fq,90), 250 + i*90));
}

/* ---------- Défi 1 : la clé à molette (briques de couleurs, à glisser dans l'ordre) ---------- */
const LEGO_COL = {
  o:{f:'#ff8a2a', d:'#c4501c', l:'#ffc070'}, y:{f:'#ffd23f', d:'#e09a1a', l:'#fff4b8'},
  p:{f:'#ff6fb0', d:'#c43a82', l:'#ffb0d6'}, g:{f:'#5fd35a', d:'#2e9a36', l:'#b6f5a8'},
  c:{f:'#7ff7ff', d:'#34b8c8', l:'#d8ffff'}, b:{f:'#4fa8ff', d:'#1f63d6', l:'#9ad4ff'},
  r:{f:'#ff5a4a', d:'#b92e22', l:'#ff9a8c'}, v:{f:'#a45cff', d:'#6a2fc4', l:'#d2aaff'},
  w:{f:'#f4f1ff', d:'#b8b0d8', l:'#ffffff'}};
const legoSvg = (w, c) => { const C = LEGO_COL[c], W = w*20;
  let s = `<svg viewBox="0 0 ${W} 26" shape-rendering="crispEdges" aria-hidden="true" preserveAspectRatio="none"><rect x="1" y="7" width="${W-2}" height="18" fill="${C.f}" stroke="#120a2e" stroke-width="2"/><rect x="3" y="9" width="${W-6}" height="3" fill="${C.l}"/><rect x="3" y="20" width="${W-6}" height="3" fill="${C.d}"/>`;
  for (let k=0;k<w;k++) s += `<rect x="${k*20+5}" y="1" width="10" height="6" fill="${C.f}" stroke="#120a2e" stroke-width="2"/>`;
  return s + '</svg>'; };
// Modèle 11 × 7 : étape 0 le manche, étape 1 le socle, étape 2 les bras (un trou reste au milieu). Chaque brique a sa couleur.
const WRENCH = {w:11, h:7, parts:[
  {step:0, x:0, y:3, w:4, c:'o'}, {step:0, x:4, y:3, w:3, c:'y'},
  {step:1, x:7, y:2, w:2, c:'p'}, {step:1, x:7, y:3, w:2, c:'g'}, {step:1, x:7, y:4, w:2, c:'c'},
  {step:2, x:7, y:1, w:2, c:'b'}, {step:2, x:9, y:1, w:2, c:'r'},
  {step:2, x:7, y:5, w:2, c:'v'}, {step:2, x:9, y:5, w:2, c:'w'}]};
const TRAY_ORDER = ['b','p','o','w','g','v','y','r','c'];
function brickBoard(cls){
  const el = h(`<div class="lboard ${cls||''}" style="aspect-ratio:${WRENCH.w}/${WRENCH.h}"></div>`);
  el.place = (p, extra='') => { const e = h(`<div class="lslot ${extra}" style="left:${p.x/WRENCH.w*100}%;top:${p.y/WRENCH.h*100}%;width:${p.w/WRENCH.w*100}%;height:${100/WRENCH.h}%"></div>`); el.appendChild(e); return e; };
  return el;
}
SCREENS.defi1 = () => {
  const TOL = 1.2;                       // marge de pose, en cases (+ la moitié de la brique)
  let step = 0, errors = 0, sel = null, finished = false; const placed = {};
  const left = h(`<div class="stack"><h2>${UE('ui_d1_h')}</h2><div class="small">${UE('ui_d1_model')}</div><div class="modelbox"></div><ol class="lsteps"></ol><div class="small">${UE('ui_d1_mine')}</div></div>`);
  const model = brickBoard('small'); WRENCH.parts.forEach(p => model.place(p, 'filled').innerHTML = legoSvg(p.w, p.c));
  $('.modelbox', left).appendChild(model);
  const bd = brickBoard(); left.appendChild(bd);
  const slots = WRENCH.parts.map(p => { const s = bd.place(p); s.wp = p; s.style.setProperty('--sc', LEGO_COL[p.c].f); return s; });
  const right = h(`<div class="stack"></div>`);
  const dlg = dialog([['d1_intro','d1_rule']], null, {hideLast:true});   // les deux phrases d'un coup, sans bouton Suivant
  const tray = h(`<div class="panel stack" style="gap:10px"><div class="small">${UE('ui_d1_tray')}</div><div class="tray">${TRAY_ORDER.map(c => { const p = WRENCH.parts.find(q => q.c === c); return `<button class="tbrick" data-c="${c}" style="--w:${p.w}" aria-label="Brique">${legoSvg(p.w,c)}</button>`; }).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost rs1">${UE('ui_reset')}</button></div></div>`);
  right.append(dlg, tray);
  const lay = h(`<section class="grid2"></section>`); lay.append(left, right); screen.appendChild(lay);
  const say1 = id => dlg.setLines([id], null, {hideLast:true});
  function refresh(){
    $('.lsteps', left).innerHTML = [0,1,2].map(i => `<li class="${i<step?'done':i===step?'on':''}">${UE('ui_d1_st' + i)}${i<step?' ✔':''}</li>`).join('');
    slots.forEach(s => { if (s.classList.contains('filled')) return; s.className = 'lslot ' + (s.wp.step === step ? 'todo' : 'later'); });
  }
  function drop(c, cx, cy){
    if (finished || placed[c]) return;
    const part = WRENCH.parts.find(p => p.c === c), slot = slots.find(s => s.wp === part);
    const r = bd.getBoundingClientRect(), cell = r.width / WRENCH.w;
    const inside = cx >= r.left - cell && cx <= r.right + cell && cy >= r.top - cell && cy <= r.bottom + cell;
    if (!inside){ buzz(); say1('d1_far'); return; }
    if (part.step !== step){ errors++; buzz(); say1('d1_nope_' + step); return; }
    const dist = Math.hypot(cx - (r.left + (part.x + part.w/2) * cell), cy - (r.top + (part.y + .5) * cell)) / cell;
    if (dist > TOL + part.w/2){ buzz(); say1('d1_far'); return; }
    placed[c] = true; slot.className = 'lslot filled pop'; slot.innerHTML = legoSvg(part.w, c); beep(700, 80);
    const tb = tray.querySelector(`.tbrick[data-c="${c}"]`); tb.disabled = true; tb.classList.remove('sel'); if (sel && sel.c === c) sel = null;
    if (slots.filter(s => s.wp.step === step).every(s => s.classList.contains('filled'))){
      jingle(); step++;
      if (step < 3){ refresh(); say1('d1_step_' + step); }
      else {
        finished = true; refresh(); confetti();
        S.res.wrench = errors === 0 ? 'sans erreur' : `${errors} erreur(s) corrigée(s)`; award('d1', errors <= 2 ? 3 : errors <= 5 ? 2 : 1);
        tray.querySelectorAll('button').forEach(b => b.disabled = true);
        dlg.setLines(['d1_end1','d1_end2'], () => missionDone(0), {});
      }
    }
  }
  // Glisser-déposer (doigt ou souris) ; un simple appui sélectionne la brique, puis un appui sur le modèle la pose.
  tray.querySelectorAll('.tbrick').forEach(tb => {
    tb.addEventListener('pointerdown', e => {
      if (finished || tb.disabled) return; e.preventDefault();
      const c = tb.dataset.c, w = WRENCH.parts.find(p => p.c === c).w, x0 = e.clientX, y0 = e.clientY; let ghost = null;
      const move = ev => {
        if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8){
          const cell = bd.getBoundingClientRect().width / WRENCH.w;
          ghost = h(`<div class="lghost" style="width:${cell*w}px;height:${cell}px">${legoSvg(w,c)}</div>`); document.body.appendChild(ghost);
          slots.forEach(s => s.classList.add('dropping'));
        }
        if (ghost){ ghost.style.left = (ev.clientX - ghost.offsetWidth/2) + 'px'; ghost.style.top = (ev.clientY - ghost.offsetHeight/2) + 'px'; }
      };
      const up = ev => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        slots.forEach(s => s.classList.remove('dropping'));
        if (ghost){ ghost.remove(); drop(c, ev.clientX, ev.clientY); }
        else { sel = {c}; tray.querySelectorAll('.tbrick').forEach(b => b.classList.toggle('sel', b === tb)); }
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  });
  bd.addEventListener('click', e => { if (sel) drop(sel.c, e.clientX, e.clientY); });
  $('.rs1', tray).onclick = () => {
    if (finished) return; step = 0; sel = null; S.res.bugs++; save();
    Object.keys(placed).forEach(k => delete placed[k]);
    slots.forEach(s => { s.innerHTML = ''; s.className = 'lslot'; });
    tray.querySelectorAll('.tbrick').forEach(b => { b.classList.remove('sel'); b.disabled = false; }); refresh();
  };
  refresh();
};

/* ---------- Défi 2 : le plein du réservoir (comptage en images, dernière étape = soustraction) ---------- */
const CAN = `<svg viewBox="0 0 16 18" shape-rendering="crispEdges" aria-hidden="true"><path fill="#120a2e" d="M3 2h7v2h3v14h-12v-12h2z"/><path fill="#ff5a4a" d="M4 3h5v2h3v12h-10v-10h2z"/><path fill="#ffb0a0" d="M4 3h2v2h-2z"/><path fill="#ffd23f" d="M5 9h6v5h-6z"/><path fill="#120a2e" d="M7 10h2v3h-2z"/></svg>`;
const CALCS = [{t:'add', a:2, b:3}, {t:'add', a:2, b:1}, {t:'sub', n:2}];

  let q = 0, fuel = 0, first = true, firstCount = 0, d2pts = 0, initial = true;
  const left = h(`<div class="stack"><h2>${UE('ui_d2_h')}</h2><div class="panel stack calc"></div></div>`);

      : `<div class="small">${UE('ui_d2_cs')}</div><div class="cans subcalc"><div class="subl"><div class="op"></div><div class="grp">${canHtml(8)}${canHtml(2,'rest')}</div><div class="op">10</div></div><div class="subl"><div class="op">−</div><div class="grp">${canHtml(8)}</div><div class="op">8</div></div><div class="subl"><div class="op">=</div><div></div><div class="op ans">?</div></div></div><div class="nums">${pad}</div>`;

/* ---------- Étape 4 : programmer le voyage de Saturne à la Terre (console de flèches) ---------- */
SCREENS.step4 = () => {
  const W = 9, H = 5, start = [6,2], earth = [0,4], MAXP = 14;
  const PL = [{k:'savants',x:8,y:0},{k:'jupiter',x:4,y:2},{k:'mars',x:2,y:3},{k:'terre',x:0,y:4}];
  const left = h(`<div class="stack"><h2>${UE('ui_s4_h')}</h2></div>`);

  const right = h(`<div class="stack"></div>`);
  const lay = h(`<section class="grid2"></section>`); lay.append(left, right); screen.appendChild(lay);
  const my = epoch;
  const dlg = dialog(['t_1','t_2'], () => radar(), {last:UP('ui_s4_radar'), stay:true});
  right.appendChild(dlg);
  async function radar(){
    dlg.setLines(['t_radar'], null, {hideLast:true});
    const sweep = h(`<div class="radar"><div class="beam"></div></div>`); bd.querySelector('.board').appendChild(sweep);
    sweep.style.left = `calc(${start[0]+0.5} * ((100% - 16px)/9 + 2px))`; sweep.style.top = `calc(${start[1]+0.5} * ((100% - 8px)/5 + 2px))`;
    for (let k=0;k<4;k++){ beep(1200,60,'sine'); await sleep(600); if (my!==epoch) return; }
    bd.cell(...earth).classList.add('blip'); beep(1500,200,'sine'); await sleep(1400); if (my!==epoch) return;
    sweep.remove(); ask();
  }
  const arrowPic = a => `<span style="width:72px;height:72px;background:var(--cyan);border:3px solid var(--ink);display:grid;place-items:center"><span style="display:grid;width:48px;transform:rotate(${a}deg)">${ICON.arrow}</span></span>`;
  function ask(){
    dlg.afterLine = null;
    const box = optionsBox(dlg, {
      options:[{id:'t_oa', text:UP('ui_s4_qa'), pic:arrowPic(225)},{id:'t_ob', text:UP('ui_s4_qb'), pic:arrowPic(45)},{id:'t_oc', text:UP('ui_s4_qc'), pic:arrowPic(135)}],
      correct:0, hints:[null,'t_hint','t_hint'],
      onRight: first => { S.res.q4 = first ? 'premier coup' : 'avec un indice'; award('pos', first ? 2 : 1); dlg.afterLine = null; box.remove(); count(); }
    });
    dlg.setLines(['t_q'], null, {hideLast:true});
    right.appendChild(box);
  }
  async function count(){
    await dlg.say('t_yes'); if (my!==epoch) return;
    const v = par(dlg.say('t_left'));
    for (let k=0;k<6;k++){ if (my!==epoch) return; const c = bd.cell(5-k, 2); c.classList.add('hint'); c.dataset.n = k+1; beep(600+k*40,90); await sleep(800); }
    await v; await sleep(600); if (my!==epoch) return;
    const v2 = par(dlg.say('t_down'));
    for (let k=0;k<2;k++){ if (my!==epoch) return; const c = bd.cell(0, 3+k); c.classList.add('hint','hint2'); c.dataset.n = k+1; beep(600+k*60,90); await sleep(800); }
    await v2; await sleep(1200);
    if (my!==epoch) return;
    bd.querySelectorAll('.hint').forEach(c => { c.classList.remove('hint','hint2'); delete c.dataset.n; });
    code();
  }
  function code(){
    dlg.setLines(['t_code'], null, {hideLast:true});
    let prog = [], locked = false, done = false;
    const ed = h(`<div class="stack">
      <div class="small">${UE('ui_s4_prog')}</div>
      <div class="strip cons" aria-label="Mon programme"></div>
      <div class="pad">${['U','L','D','R'].map(d => `<button class="arrow ${d.toLowerCase()}" data-d="${d}" aria-label="${NAME[d]}">${arrowSvg(d)}</button>`).join('')}</div>
      <div class="rowbtn">
        <button class="btn ghost undo">${UE('ui_s4_undo')}</button>
        <button class="btn ghost clear">${UE('ui_s4_clear')}</button>
        <button class="btn go run big">${UE('ui_s4_run')} ▶</button></div></div>`);
    const strip = $('.strip', ed);
    const draw = (cur=-1, err=-1) => {
      strip.innerHTML = prog.map((d,i) => `<button class="card ${i===err?'err':i===cur?'cur':''}" data-i="${i}" ${locked?'disabled':''} aria-label="Flèche ${i+1} : ${NAME[d]}, toucher pour enlever"><span class="n">${i+1}</span>${arrowSvg(d)}</button>`).join('')
        + Array.from({length: Math.max(0, Math.min(3, MAXP - prog.length))}, () => '<div class="card empty"></div>').join('');
    };
    const lock = v => { locked = v; ed.querySelectorAll('.pad button,.rowbtn button').forEach(b => b.disabled = v); draw(); };
    ed.querySelectorAll('.arrow').forEach(b => b.onclick = () => { if (locked || done || prog.length >= MAXP) return; prog.push(b.dataset.d); beep(520+prog.length*20, 60); draw(); });
    strip.onclick = e => { const c = e.target.closest('.card[data-i]'); if (!c || locked || done) return; prog.splice(+c.dataset.i, 1); draw(); };
    $('.undo', ed).onclick = () => { if (locked || done) return; prog.pop(); draw(); };
    $('.clear', ed).onclick = () => { if (locked || done) return; prog = []; draw(); };
    const back = () => { if (my!==epoch) return; rocket.classList.remove('land'); rocket.place(...start, 'U'); lock(false); };
    $('.run', ed).onclick = async () => {
      if (locked || done || !prog.length) return;
      S.res.landTries++; save(); lock(true); await sleep(250);
      const free = (x,y) => (x<0||y<0||x>=W||y>=H) ? 'out' : true;
      const r = await execute(prog, start, free, async (i,x,y,d,ok) => { draw(i); if (ok===true){ rocket.place(x,y,d); beep(500+i*30,60); } });
      if (r.abort) return;
      if (!r.ok){ S.res.bugs++; save(); buzz(); draw(-1, r.fail); await dlg.say('t_out'); await sleep(700); back(); return; }
      if (r.x!==earth[0] || r.y!==earth[1]){ S.res.bugs++; save(); buzz(); await dlg.say('t_miss'); await sleep(500); back(); return; }
      done = true; rocket.classList.add('land'); jingle(); confetti();
      award('trip', S.res.landTries <= 2 ? 5 : S.res.landTries === 3 ? 3 : 2);
      await sleep(1300); if (my!==epoch) return;
      dlg.setLines([prog.length === 8 ? 't_perfect' : 't_other', 't_final'], () => go('bilan'), {last:UP('ui_continue'), stay:true});
    };
    draw(); right.appendChild(ed);
  }
};

  const defaults = TEXT_DEFAULTS;
  let SV = {on:false, key:false, voice:''};

  /* sauvegarde : tablette + serveur */
  const persist = async () => {
    TX_LOCAL = JSON.parse(JSON.stringify(draft));
    try { localStorage.setItem('arcade-seance1-textes', JSON.stringify(TX_LOCAL)); } catch(e) {}
    if (HAS_SERVER){ try { await api('/api/texts', draft); } catch(e) { status('Enregistré sur cette tablette, mais pas sur le serveur : ' + e.message, 'bad'); return false; } }
    return true;
  };
  const setBadge = (it, t, cls) => { const b = $('.vbadge', it); if (!b) return; b.hidden = !t; b.textContent = t || ''; b.className = 'badge vbadge ' + (cls || ''); };
  const regen = async (k, it) => {
    if (!SV.on || !SV.key || !SV.voice || !isSpeechKey(k)) return;
    const text = k in draft ? draft[k] : defaults[k];
    if (it) setBadge(it, 'voix en cours…', 'wait');
    try { await genOne(k, text); if (it) setBadge(it, 'voix à jour', 'ok'); }
    catch(e) { if (it) setBadge(it, 'erreur voix', 'bad'); status('Voix non générée : ' + e.message, 'bad'); }
  };

  /* un champ de texte */
  const makeItem = (k, label, def, isCustom) => {
    const it = h(`<div class="titem" data-k="${k}">
      <div class="row" style="justify-content:space-between"><label for="tx-${k}">${esc(label)} <span class="small">(${k})</span></label>
        <span class="row" style="gap:8px"><span class="badge vbadge" hidden></span><span class="badge modbadge" hidden>modifié</span><button class="btn ghost rst" hidden>Rétablir</button>${isSpeechKey(k) ? '<button class="btn ghost lst">Écouter</button>' : ''}${isCustom ? '<button class="btn ghost del">Supprimer</button>' : ''}</span></div>
      <textarea id="tx-${k}" rows="1" spellcheck="true"></textarea></div>`);
    const ta = $('textarea', it);
    ta.value = k in draft ? draft[k] : def;
    const sync = () => {
      const changed = !isCustom && ta.value !== def;
      if (!isCustom){ if (changed) draft[k] = ta.value; else delete draft[k]; } else draft[k] = ta.value;
      $('.modbadge', it).hidden = !changed; $('.rst', it).hidden = !changed; it.classList.toggle('mod', changed);
      ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
      const n = Object.keys(draft).filter(x => x !== '_custom').length; $('.modcount', el).textContent = n ? `${n} texte(s) modifié(s) ou ajouté(s)` : '';
    };
    ta.oninput = sync;
    ta.onchange = async () => { sync(); if (await persist()){ status('Enregistré.', 'good'); await regen(k, it); if (isSpeechKey(k)) status('Enregistré, voix mise à jour.', 'good'); } };
    $('.rst', it).onclick = async () => { ta.value = def; sync(); if (await persist()){ status('Texte rétabli.', 'good'); await regen(k, it); } };
    const ls = $('.lst', it);
    if (ls) ls.onclick = () => { stopVoice(); const old = ta.value; ta.value = old; voice(k); };   // joue le vrai fichier audio s'il existe
    const del = $('.del', it);
    if (del) del.onclick = async () => { draft._custom = draft._custom.filter(c => c.k !== k); delete draft[k]; it.remove(); await persist(); status('Texte supprimé.', 'good'); };
    requestAnimationFrame(sync);
    return it;
  };

  /* groupes */
  const groups = [];
  TEXT_GROUPS.forEach((g, gi) => {
    const sec = h(`<div class="panel stack tgroup" id="tg-${gi}"><h2>${esc(g.g)}</h2></div>`);
    g.items.forEach(([k, label, def]) => sec.appendChild(makeItem(k, label, def, false)));
    groups.push(sec); el.appendChild(sec);
  });
  const customBox = $('.customlist', el);
  const drawCustom = () => {
    customBox.innerHTML = '';
    draft._custom.forEach(c => {
      const lab = c.type === 'dit' ? `Phrase ajoutée (après « ${c.after} »)` : `Texte ajouté à l'écran « ${SCREEN_NAMES[c.screen] || c.screen} »`;
      customBox.appendChild(makeItem(c.k, lab, '', true));
    });
  };
  drawCustom();

  /* ajouter */
  const sel = $('#newAfter', el);
  sel.innerHTML = TEXT_GROUPS.filter(g => !g.ui && !g.g.startsWith('Nombres')).map(g => `<optgroup label="${esc(g.g)}">${g.items.map(([k,l]) => `<option value="${k}">${esc(l)} (${k})</option>`).join('')}</optgroup>`).join('');
  $('#newType', el).onchange = e => { $('.newdit', el).hidden = e.target.value !== 'dit'; $('.newecran', el).hidden = e.target.value !== 'ecran'; };
  $('.addtext', el).onclick = async () => {
    const text = $('#newText', el).value.trim(); if (!text){ status('Écris d\'abord le texte à ajouter.', 'bad'); return; }
    const type = $('#newType', el).value; let n = 1; const used = new Set(draft._custom.map(c => c.k));
    while (used.has('x_' + n)) n++;
    const c = {k:'x_' + n, type}; if (type === 'dit') c.after = sel.value; else c.screen = $('#newScreen', el).value;
    draft._custom.push(c); draft[c.k] = text; $('#newText', el).value = '';
    drawCustom(); const it = customBox.querySelector(`[data-k="${c.k}"]`);
    if (await persist()){ status('Texte ajouté.', 'good'); if (type === 'dit') await regen(c.k, it); if (type === 'dit') status('Texte ajouté, voix générée.', 'good'); }
  };

  /* filtre / navigation */
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => $(`#tg-${c.dataset.g}`).scrollIntoView({behavior:'smooth', block:'start'}));
  $('#txFilter', el).oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    el.querySelectorAll('.tgroup .titem').forEach(it => { it.hidden = !!q && !(it.textContent + ' ' + $('textarea', it).value).toLowerCase().includes(q); });
    groups.forEach(g => g.hidden = !!q && ![...g.querySelectorAll('.titem')].some(it => !it.hidden));
  };
  $('.back', el).onclick = () => go(S.lastScreen && SCREENS[S.lastScreen] ? S.lastScreen : 'intro');

  /* exports */
  const dl = (name, text, type) => { const url = URL.createObjectURL(new Blob([text], {type})); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); };
  $('.dljson', el).onclick = () => dl('voix.json', JSON.stringify(speechTexts(draft), null, 1), 'application/json');
  $('.dlbtn', el).onclick = () => {
    const json = JSON.stringify(draft, null, 1).replace(/</g, '\\u003c');
    dl('arcade_seance1_professeur_pile_poil.html', '<!doctype html>\n' + BOOT_HTML.replace(/(<script id="texts" type="application\/json">)[\s\S]*?(<\/script>)/, (_, a, b) => a + json + b), 'text/html');
  };

  /* panneau ElevenLabs */
  const vs = $('.vstatus', el);
  const bulk = async (force) => {
    const items = speechTexts(draft); const pr = $('.vprog', el); pr.hidden = false;
    let todo;
    try { const p = await api('/api/plan', {items}); todo = force ? Object.keys(items) : [...p.missing, ...p.stale]; }
    catch(e) { pr.textContent = e.message; return; }
    if (!todo.length){ pr.textContent = 'Toutes les voix sont à jour.'; return; }
    let done = 0, fail = 0;
    for (const k of todo){
      if (my !== epoch) return;
      pr.textContent = `Génération ${done + fail + 1} / ${todo.length}… (${k})`;
      try { await genOne(k, items[k], force); done++; } catch(e) { fail++; pr.textContent = 'Erreur : ' + e.message; if (/refuse la clé|Choisis/.test(e.message)) return; }
    }
    pr.textContent = `Terminé : ${done} voix générée(s)${fail ? `, ${fail} erreur(s)` : ''}.`;
  };
  $('.exportbtn', el).onclick = async () => {
    const pr = $('.vprog', el); pr.hidden = false; pr.textContent = 'Préparation du dossier…';
    try { const r = await api('/api/export', {}); pr.textContent = `Dossier prêt : ${r.dest} (${r.voices} voix incluses).` + (r.missing.length ? ` Attention : ${r.missing.length} phrase(s) sans voix, génère-les d'abord.` : '') + (r.stale.length ? ` ${r.stale.length} voix pas à jour.` : ''); }
    catch(e) { pr.textContent = 'Erreur : ' + e.message; }
  };
  let armed = false;
  $('.genmissing', el).onclick = () => bulk(false);
  $('.genall', el).onclick = e => { if (!armed){ armed = true; e.target.textContent = 'Confirmer : tout régénérer (consomme des crédits)'; return; } armed = false; e.target.textContent = 'Tout régénérer'; bulk(true); };
  (async () => {
    if (!HAS_SERVER){ vs.innerHTML = 'Le jeu est ouvert comme un simple fichier : la génération des voix est désactivée. Lance <b>python3 server.py</b> dans le dossier du jeu, puis ouvre <b>http://localhost:8000</b>.'; return; }
    try {
      const st = await api('/api/status'); SV = {on:true, key:st.key, voice:st.voice_id};
      if (!st.key){ vs.innerHTML = 'Clé ElevenLabs introuvable. Ajoute <b>ELEVENLABS_API_KEY=ta_clé</b> dans le fichier <b>.env</b> (à côté de server.py), puis relance le serveur.'; return; }
      vs.textContent = 'Clé ElevenLabs trouvée.' + (st.voice_id ? ' Voix choisie : ' + st.voice_id + '.' : ' Choisis une voix ci-dessous.');
      $('.vctl', el).hidden = false; $('.vgen', el).hidden = false;
      const vsel = $('#voiceSel', el);
      try {
        const vv = (await api('/api/voices')).voices;
        vsel.innerHTML = vv.map(v => `<option value="${esc(v.id)}">${esc(v.name)}${v.lang ? ' · ' + esc(v.lang) : ''}${v.desc ? ' · ' + esc(v.desc) : ''}</option>`).join('');
        if (st.voice_id && vv.some(v => v.id === st.voice_id)) vsel.value = st.voice_id;
        else if (st.voice_id) vsel.insertAdjacentHTML('afterbegin', `<option value="${esc(st.voice_id)}">Voix du fichier .env (${esc(st.voice_id)})</option>`), vsel.value = st.voice_id;
      } catch(e) { vsel.innerHTML = st.voice_id ? `<option value="${esc(st.voice_id)}">Voix du fichier .env</option>` : ''; vs.textContent += ' (liste des voix indisponible : ' + e.message + ')'; }
      $('.usevoice', el).onclick = async () => { try { await api('/api/settings', {voice_id: vsel.value}); SV.voice = vsel.value; vs.textContent = 'Voix choisie : ' + vsel.value + '. Les voix déjà générées seront régénérées avec elle.'; } catch(e) { status(e.message, 'bad'); } };
      // état des voix de chaque texte
      const p = await api('/api/plan', {items: speechTexts(draft)});
      const stale = new Set([...p.missing, ...p.stale]);
      el.querySelectorAll('.titem').forEach(it => { const k = it.dataset.k; if (isSpeechKey(k)) setBadge(it, stale.has(k) ? 'voix à générer' : 'voix à jour', stale.has(k) ? 'wait' : 'ok'); });
      if (stale.size) { const pr = $('.vprog', el); pr.hidden = false; pr.textContent = `${stale.size} voix à générer ou mettre à jour : clique sur « Générer ».`; }
    } catch(e) { vs.textContent = 'Serveur indisponible : ' + e.message; }
  })();
};

/* ---------- Menu intervenant ---------- */
function openMenu(){
  const ov = h(`<div class="overlay"><div class="panel stack" role="dialog" aria-label="Menu intervenant">
    <div class="row" style="justify-content:space-between"><h2>MENU INTERVENANT</h2><button class="btn ghost close">✕</button></div>
    <p class="small" style="margin:0">Aller directement à une partie de la séance :</p>
    <div class="menu-grid">
      <button class="btn ghost" data-go="intro">L'histoire</button>
      <button class="btn ghost" data-go="step2">Devinette</button>
      <button class="btn ghost" data-go="hub">La fusée</button>
      <button class="btn ghost" data-go="defi1">Défi 1 · Clé à molette</button>
      <button class="btn ghost" data-go="defi2">Défi 2 · Carburant</button>
      <button class="btn ghost" data-go="defi3">Défi 3 · Allumage</button>
      <button class="btn ghost" data-go="step4">Cap sur la Terre</button>
      <button class="btn ghost" data-go="bilan">Points de l'enfant</button>
    </div>
    <h2 style="font-size:11px">ÉTAT DES NIVEAUX</h2>
    <p class="small" style="margin:0">Marque un niveau comme réussi ou à refaire, puis ouvre-le pour tester la suite.</p>
    <div class="lvstates stack" style="gap:8px"></div>
    <div class="row"><button class="btn go texts">✎ Script oral</button><button class="btn ghost unlock">Débloquer tous les défis</button><button class="btn reset">Nouvel enfant</button></div>
    <p class="small confirm" hidden style="margin:0;color:var(--pink)">Appuie encore sur « Nouvel enfant » pour effacer les points de cet enfant.</p>
  </div></div>`);
  ov.querySelector('.close').onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  const LV = [
    {label:'Devinette', go:'step2', pts:{q1:2, q2:2}},
    {label:'Défi 1 · Clé à molette', go:'defi1', idx:0, pts:{d1:3}},
    {label:'Défi 2 · Carburant', go:'defi2', idx:1, pts:{d2:3}},
    {label:'Défi 3 · Allumage', go:'defi3', idx:2, pts:{d3:3}},
    {label:'Cap sur la Terre', go:'step4', pts:{pos:2, trip:5}}];
  const lvBox = ov.querySelector('.lvstates');
  const isOk = L => L.idx !== undefined ? S.repaired[L.idx] : Object.keys(L.pts).every(k => k in (S.pts || {}));
  function drawLv(){
    lvBox.innerHTML = LV.map((L,i) => `<div class="row" style="justify-content:space-between;padding:8px 10px;background:var(--panel-lo);border:3px solid var(--ink)">
      <span style="font-weight:600">${esc(L.label)} · <b style="color:${isOk(L) ? 'var(--green)' : 'var(--pink)'}">${isOk(L) ? 'réussi' : 'à faire'}</b></span>
      <span class="row" style="gap:6px"><button class="btn go" data-ok="${i}" style="min-height:40px;padding:6px 10px;font-size:9px">Réussi</button><button class="btn ghost" data-ko="${i}" style="min-height:40px;padding:6px 10px;font-size:9px">À refaire</button><button class="btn" data-open="${i}" style="min-height:40px;padding:6px 10px;font-size:9px">Ouvrir ▶</button></span></div>`).join('');
  }
  lvBox.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    S.pts = S.pts || {};
    if (b.dataset.ok !== undefined){ const L = LV[+b.dataset.ok]; if (L.idx !== undefined) S.repaired[L.idx] = true; Object.assign(S.pts, L.pts); }
    else if (b.dataset.ko !== undefined){ const L = LV[+b.dataset.ko]; if (L.idx !== undefined) S.repaired[L.idx] = false; Object.keys(L.pts).forEach(k => delete S.pts[k]); }
    else if (b.dataset.open !== undefined){ ov.remove(); go(LV[+b.dataset.open].go); return; }
    save(); renderScore(); drawLv();
  };
  drawLv();
  ov.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { ov.remove(); go(b.dataset.go); });
  ov.querySelector('.texts').onclick = () => { ov.remove(); go('textes'); };
  ov.querySelector('.unlock').onclick = () => { S.repaired = S.repaired.map(() => true); save(); ov.remove(); go('hub'); };
  let armed = false;
  ov.querySelector('.reset').onclick = () => { if (!armed){ armed = true; ov.querySelector('.confirm').hidden = false; return; } S = fresh(); save(); cahier(c => { delete c.seances[SEANCE_N]; if (c.last && c.last.n === SEANCE_N) delete c.last; }); renderScore(); ov.remove(); go('intro'); };
  document.body.appendChild(ov);
}

/* ---------- Démarrage ---------- */
renderHeader(); renderScore();
(async () => {
  try {
    const r = await Promise.race([fetch('texts.json', {cache:'no-store'}), sleep(2500).then(() => null)]);
    if (r && r.ok){ const j = await r.json(); if (j && typeof j === 'object') TX_PUB = Object.assign({}, TX_PUB, j); }
  } catch(e) {}
  try { const m = await Promise.race([fetch(AUDIO_DIR + 'manifest.json', {cache:'no-store'}), sleep(2500).then(() => null)]); if (m && m.ok){ const j = await m.json(); Object.keys(j).forEach(k => AUDIO_VER[k] = String(j[k]).slice(0, 10)); } } catch(e) {}
  renderHeader();
  go(SCREENS[S.screen] && S.screen !== 'textes' ? S.screen : 'intro');
})();

</script>
